<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf6f0">
  <title>First Love 初恋 — 全話まとめ</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 20px; background: #faf6f0; color: #263e3c; font-family: system-ui, sans-serif; line-height: 1.7; }
    main { max-width: 520px; margin: 8vh auto; padding: 28px 22px; background: #fffdf9; border: 1px solid #e4d7ce; border-radius: 20px; }
    .eyebrow { color: #b44f41; font-size: 14px; font-weight: 700; }
    h1 { margin: 8px 0; font-size: clamp(24px, 6vw, 34px); }
    p { margin: 12px 0; }
    audio { display: block; width: 100%; margin: 24px 0 18px; }
    label { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; }
    input { width: 20px; height: 20px; accent-color: #b44f41; }
    a { color: #a54438; text-underline-offset: 4px; }
    .download { display: block; margin: 20px 0 8px; }
    .back { display: inline-block; margin-top: 18px; }
    #status { font-size: 14px; color: #a54438; }
    #status:empty { display: none; }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">全話まとめ</span>
    <h1>First Love 初恋</h1>
    <p>第1話〜第9話の音声413件<br>22分46秒</p>
    <audio id="fullAudio" controls preload="none" aria-label="First Love 初恋 全話まとめ" src="/drama-audio/first-love-2022/all-episodes-20261029-v1.mp3"></audio>
    <label><input id="repeat" type="checkbox">リピート</label>
    <p id="status" role="status" aria-live="polite"></p>
    <a class="download" href="/drama-audio/first-love-2022/all-episodes-20261029-v1.mp3" download="First Love 初恋 全話まとめ.mp3">音声をダウンロード</a>
    <a class="back" href="/">アプリに戻る</a>
  </main>
  <script>
    const audio = document.getElementById('fullAudio');
    const status = document.getElementById('status');
    document.getElementById('repeat').addEventListener('change', event => { audio.loop = event.target.checked; });
    audio.addEventListener('waiting', () => { status.textContent = '音声を読み込み中…'; });
    audio.addEventListener('playing', () => { status.textContent = ''; });
    audio.addEventListener('error', () => { status.textContent = '音声を読み込めませんでした。ページを再読み込みするか、ダウンロードをお試しください。'; });
  </script>
</body>
</html>
